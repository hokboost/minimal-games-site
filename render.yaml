services:
  - type: web
    name: minimal-games-site
    env: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.4
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_SSL_CA
        value: ""
      - key: SESSION_SECRET
        sync: false
      - key: IDEMPOTENCY_HMAC_SECRET
        sync: false
      - key: RESET_TOKEN_SECRET
        sync: false
      - key: ANALYTICS_TOKEN_SECRET
        sync: false
      - key: DICTATION_TOKEN_SECRET
        sync: false
      - key: LOG_HASH_SECRET
        sync: false
      - key: WORKER_CREDENTIALS_JSON
        sync: false
      - key: READINESS_TOKEN
        sync: false
      - key: TRUSTED_PROXY_ADDRESSES
        sync: false
      - key: EXTERNAL_GIFTS_ENABLED
        value: "false"
      - key: PK_EXTERNAL_SEND_ENABLED
        value: "false"
      - key: DAILY_GIFT_SPEND_LIMIT
        value: "50000"
      - key: DAILY_USER_GIFT_SPEND_LIMIT
        value: "10000"
      - key: TASK_CARDS_ENABLED_USERS
        value: "hokboost"
      - key: STREAMER_WORLD_ENABLED
        value: "true"
      - key: CREATOR_PROFILE_ENABLED
        value: "true"
      - key: QUEST_ENGINE_V2_ENABLED
        value: "true"
      - key: STORY_WORLD_ENABLED
        value: "true"
      - key: LIVE_INTERACTIONS_ENABLED
        value: "true"
      - key: STREAMER_NEW_GAMES_ENABLED
        value: "true"
      - key: STREAMER_REWARD_CATALOG_ENABLED
        value: "true"
      - key: STREAMER_ACHIEVEMENTS_ENABLED
        value: "true"
      - key: STREAMER_WORLD_OWNER_USERNAME
        sync: false
