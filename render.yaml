services:
  - type: web
    name: minimal-games-site
    env: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.4
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_SSL_CA
        value: ""
      - key: SESSION_SECRET
        sync: false
      - key: LOG_HASH_SECRET
        sync: false
      - key: WINDOWS_API_KEY
        sync: false
      - key: GIFT_TASKS_HMAC_SECRET
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
